<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionWear AI - Virtual Try-On</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-overlay">
        <div class="modal">
            <h1>VisionWear AI</h1>
            <p>Espejo virtual con estimación de postura en tiempo real.</p>
            <button id="start-button">Permitir Cámara e Iniciar</button>
            <div id="loading-indicator">Cargando modelos de IA y 3D...</div>
            <div id="error-message"></div>
        </div>
    </div>

    <video id="webcam-video" autoplay playsinline muted></video>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

    <script type="module" src="src/app.js?v=7"></script>
</body>
</html>
